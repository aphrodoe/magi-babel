services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime_kuma:/app/data
    # One network per thing it has to reach: `edge` so Caddy can serve it and
    # so it can probe the public hostnames, `bus` for a TCP check against
    # mosquitto:1883, `glass` for Loki — which has no public hostname by
    # design. All of it stays off the host, so ufw is never in the path.
    networks: [edge, bus, glass]

networks:
  edge:
    external: true
  bus:
    external: true
  glass:
    external: true

volumes:
  uptime_kuma:
