services:
  authelia:
    image: authelia/authelia:4.39
    container_name: authelia
    restart: unless-stopped
    # No published port. Caddy reaches it over `edge`, so the login service
    # never exists as a socket on the host — nothing for ufw to have an
    # opinion about, and no way to reach it except through the front door.
    env_file:
      - ../../secrets/authelia.env
    volumes:
      - ../../config/authelia/configuration.yml:/config/configuration.yml:ro
      # Read-write, unlike the config: Authelia rewrites this file when a
      # password changes, and `watch: true` reloads it without a restart.
      - ../../secrets/authelia/users.yml:/config/users.yml
      - authelia_data:/data
    networks: [edge]

networks:
  edge:
    external: true

volumes:
  authelia_data:
