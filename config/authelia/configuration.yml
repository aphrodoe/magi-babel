# Authelia — the single front door for H-04.
#
# Stood up FIRST, deliberately. Retrofitting forward-auth across eight running
# services means editing eight Caddyfile blocks and re-testing eight login
# flows; putting it in front of the first one costs nothing.
#
# Secrets are NOT in this file. They arrive as environment variables from
# secrets/authelia.env, which 65-authelia.sh generates. Same pattern as
# grafana.env and caddy.env.

theme: dark

server:
  address: 'tcp://:9091'

log:
  level: info

totp:
  issuer: lab.akhildhyani.me

authentication_backend:
  # A YAML file, not LDAP. LDAP is a second stateful service to run and back up
  # so that one person can log in. Revisit if this ever has real users.
  file:
    path: /config/users.yml
    watch: true
    password:
      algorithm: argon2

access_control:
  # Deny by default: a new subdomain added to the Caddyfile is locked until a
  # rule here says otherwise. The opposite default fails open, silently.
  default_policy: deny

  rules:
    - domain: prom.lab.akhildhyani.me
      policy: one_factor

session:
  # No Redis. Authelia keeps sessions in memory when no provider is configured,
  # which for one user on one instance costs a re-login after a restart —
  # against a container, a volume and a failure mode to run. Add Redis when a
  # second Authelia instance exists, which is H-10 at the earliest.
  cookies:
    - domain: lab.akhildhyani.me
      authelia_url: https://auth.lab.akhildhyani.me
      default_redirection_url: https://grafana.lab.akhildhyani.me
      expiration: 12h
      inactivity: 2h

regulation:
  # Brute-force damping. The tailnet is one person, but this is free.
  max_retries: 4
  find_time: 2m
  ban_time: 10m

storage:
  local:
    path: /data/db.sqlite3

notifier:
  # Writes password-reset and 2FA-registration links to a file instead of
  # emailing them. The one person who would receive the mail has a shell on the
  # box, so SMTP would only add credentials to leak. Read it with:
  #   docker compose -f compose/authelia/compose.yaml exec authelia \
  #     cat /data/notification.txt
  filesystem:
    filename: /data/notification.txt
