# MAGI networking. Single source of truth — install with scripts/apply-netplan.sh.
# Matches any wired interface (en*), which covers both the USB-C ethernet adapter
# and a phone tether, so swapping the cable needs no config change.
# optional: true is INERT on this netplan version — it emits no RequiredForOnline=no,
# and networkctl still reports "Required For Online: yes". Kept because it states the
# intent and may start working after an upgrade; the thing actually stopping a 2-minute
# boot stall is the wait-online drop-in in scripts/h00-harden.sh. Check both if boot
# ever hangs on the network.
network:
  version: 2
  renderer: networkd
  ethernets:
    wired:
      match:
        name: "en*"
      dhcp4: true
      dhcp4-overrides:
        route-metric: 100
      optional: true
