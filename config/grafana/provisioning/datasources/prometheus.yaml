apiVersion: 1

# Removed before the datasources below are applied. Provisioning can create a
# datasource and it can update one, but it cannot repoint an existing one at a
# new uid — it looks the record up *by* uid, doesn't find it, and Grafana exits
# rather than starting with a half-applied config. Deleting first makes this
# file authoritative instead of merely advisory.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    # Fixed, because dashboards in dashboards/ reference it by uid. Let
    # Grafana generate one and every provisioned dashboard breaks on rebuild.
    uid: prometheus
    type: prometheus
    access: proxy
    # Container name on the `glass` network — Grafana reaches Prometheus
    # directly, not back out through Caddy.
    url: http://prometheus:9090
    isDefault: true
    # Lets a later edit of this file win over whatever is in grafana.db.
    editable: false
