apiVersion: 1

datasources:
  - name: Prometheus
    # Fixed, because dashboards in dashboards/ reference it by uid. Let
    # Grafana generate one and every provisioned dashboard breaks on rebuild.
    uid: prometheus
    type: prometheus
    access: proxy
    # Container name on the `glass` network — Grafana reaches Prometheus
    # directly, not back out through Caddy.
    url: http://prometheus:9090
    isDefault: true
    # Lets a later edit of this file win over whatever is in grafana.db.
    editable: false
