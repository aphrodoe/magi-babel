apiVersion: 1

# Anything dropped in dashboards/ as exported JSON gets loaded at start and
# re-read every 30s. Exporting a dashboard back to that directory is how a
# dashboard survives the rebuild (R1).
providers:
  - name: magi
    folder: MAGI
    type: file
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
