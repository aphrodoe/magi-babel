# MAGI — the nervous system. Topic schema lives in TOPICS.md, next to this file.

listener 1883

# No anonymous clients, from the first boot. Turning auth on later means
# revisiting every publisher that was written without it.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Retained messages and queued QoS-1 traffic survive a restart. Without this,
# every `status` and `state` topic is empty after `docker compose up` — which
# is exactly the state the retain flag exists to prevent.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# stdout, so Docker's json-file driver applies the 10 MB × 3 cap from
# scripts/magi/40-docker.sh instead of a log file growing inside the volume.
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
